# Auxiliary 12-class anatomical-region/grade model. Its predictions are not
# whole fish and must pass through part association before tracking/counting.
model: yolov8n-seg.pt
data: dataset/canonical_v7_parts/data.yaml
imgsz: 640
epochs: 100
patience: 20
batch_size: 8
pretrained: true
optimizer: auto
learning_rate: 0.01
seed: 42
device: auto
workers: 2
project_dir: models/yolo_parts

degrees: 10.0
translate: 0.05
scale: 0.15
shear: 0.0
perspective: 0.0
flipud: 0.1
fliplr: 0.5
mosaic: 0.25
mixup: 0.0
copy_paste: 0.1
hsv_h: 0.01
hsv_s: 0.15
hsv_v: 0.10
erasing: 0.0

runtime_role: auxiliary_part_evidence
annotation_unit: fish_part
final_fish_classes: [Class A, Class B, Class C, Rejected]
