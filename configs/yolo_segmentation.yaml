# Transfer-learned instance-segmentation baseline.
# A0 intentionally disables augmentation. Add validated A1/A2/A3 profiles as
# separate config files; do not tune any parameter against the final test set.
model: yolov8n-seg.pt
epochs: 50
batch_size: 8
seed: 42
device: auto
workers: 2
project_dir: models/yolo_segmentation
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
erasing: 0.0
